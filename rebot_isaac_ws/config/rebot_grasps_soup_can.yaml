# Grasp set for the reBot B601-DM parallel gripper on the NVIDIA stock soup can.
#
# GENERATED by rebot_b601dm_perception.grasps.author_grasp_set. Do not hand-edit:
#   python3 -m rebot_b601dm_perception.write_grasps
# test_grasp_authoring.py regenerates and compares this file exactly.
#
# SCHEMA is upstream's `isaac_grasp` 1.0, so the existing consumer
# (isaac_ros_manipulation_ros_python_utils.grasp_reader.GraspReader) reads this
# file unchanged. GraspReader consumes only `position` and `orientation` from
# each entry and composes  world_pose_gripper = world_pose_object @ stored.
# Everything else below is recorded for humans and for the test suite.
#
# The two upstream reference files disagree on the frame key spelling
# (`object_frame` in robotiq_2f_85_grasps_soup_can.yaml, `object_frame_link` in
# grav_grasps_soup_can.yaml) and GraspReader reads NEITHER. Both spellings are
# emitted with identical values so either convention resolves correctly.
#
# WHAT IS STORED:  T_object_gripper_tcp.
# Composed at runtime as  T_cell_tcp = T_cell_object . T_object_tcp,  so the
# file is valid wherever the can is. gripper_tcp and NOT gripper_link: they are
# 44.3 mm apart along the approach axis (docs/KDR-001-kinematic-frames.md).
#
# FRAMES
#   object: soup_can, origin at the CENTRE OF THE BASE, axis +Z.
#           diameter 0.066 m, height 0.101 m.
#   gripper_tcp: +X is the APPROACH axis (jaws close on what lies ahead);
#                +/-Y is the CLOSING axis (jaw travel).
#   orientation is {w, xyz} -- w FIRST, per the isaac_grasp schema. The trial
#                files use xyzw. A silent swap is a 180-degree error that still
#                normalises to a unit quaternion.
#
# JAW COMMANDS ARE HALF-GAPS -- every command below is published with the gap
# it produces. Commanding 0.030 opens a 0.060 m gap, and on this 0.066 m can
# that is 3 mm of interpenetration per side. That exact bug has already shipped
# once in this project's trial data and was caught.
#
#   contact  0.034 m/jaw -> gap 0.067945 m
#            can presents 0.066000 m across -> clearance 1.945 mm total (0.972 mm/side).
#            NOMINAL. The pad inner faces sit inside the collision meshes, which
#            this generator does not read, so the true gap is smaller by an
#            unmodelled pad thickness. CLOSE ON FORCE/EFFORT, not on this number.
#   pregrasp 0.045 m/jaw -> gap 0.089945 m
#
# NOTE the contact command is 0.0340, not the tempting rounded 0.033.
# 0.033 gives a 0.065945 m gap: 55 um narrower than the can because of
# the residual in the jaw joint origins. That is below hardware repeatability,
# but it does not satisfy a strict gap > diameter assertion.
#
# PREGRASP GEOMETRY
#   Offset 0.1 m back along -X of the TCP (i.e. along -approach).
#   For a HORIZONTAL side grasp the approach is in the ground plane, so this
#   backs the pregrasp radially OUTWARD from the can (not upward), clear of the
#   0.033 m radius with 0.067 m to spare.
#   NOTE the BT's grasp_approach_offset_distance must back off along the TCP
#   approach axis too: for this robot that is [-0.15, 0, 0] (TCP -X), NOT the
#   UR/Flexiv [0, 0, -0.15] (their approach is +Z).
#
# WHY A FEW HORIZONTAL SIDE GRASPS
#   This arm can only SIDE-grasp the can, never top-down: measured on the GPU,
#   a horizontal approach plans at every roll while ANY downward tilt fails IK.
#   So every grasp here approaches HORIZONTALLY (approach axis in the ground
#   plane), closing across the can diameter, TCP on the upper body of the
#   bottom-up source can. The can is a
#   cylinder so all azimuths grasp it equally; only a FEW near azimuths are
#   offered (the rest point the gripper back through the arm base and never
#   solve). cuMotion plans the set as a goalset and picks a reachable one.
#   3 horizontal grasps at azimuths [0.0, -20.0, 20.0] deg about the can axis. Roll is fixed at 0:
#   rolling about the approach would swing the closing direction toward the
#   can's 0.101 m height and require a 0.101 m gap.

format: isaac_grasp
format_version: 1.0

object_frame: /soup_can
gripper_frame: /gripper_tcp
object_frame_link: /soup_can
gripper_frame_link: /gripper_tcp

# Object dimensions, restated so a consumer can re-derive the gap check.
# test_grasp_authoring.py verifies this file against the canonical geometry.
object_geometry:
  name: soup_can
  diameter_m: 0.066
  height_m: 0.101
  origin: base_centre
  axis: [0.0, 0.0, 1.0]
  # T_object_mesh for the centered FoundationPose mesh (top axis +Y).
  mesh_pose_in_object:
    position: [0.000000000, 0.000000000, 0.050500000]
    orientation: {w: 0.707106781, xyz: [0.707106781, 0.000000000, 0.000000000]}

grasps:
  grasp_0:
    confidence: 1.0
    position: [0.000000000, 0.000000000, 0.011000000]
    orientation: {w: 1.000000000, xyz: [0.000000000, 0.000000000, 0.000000000]}
    cspace_position:
      gripper_joint1: 0.034   # gap 0.067945 m
      gripper_joint2: 0.034   # mimic of gripper_joint1, multiplier +1.0
    pregrasp_cspace_position:
      gripper_joint1: 0.045   # gap 0.089945 m
      gripper_joint2: 0.045   # mimic of gripper_joint1, multiplier +1.0
    # ---- consumed by rebot_b601dm_perception, ignored by GraspReader ----
    rebot:
      azimuth_deg: 0.0
      tilt_deg: 0.0
      jaw_contact_m: 0.034
      jaw_contact_gap_m: 0.067944943
      jaw_pregrasp_m: 0.045
      jaw_pregrasp_gap_m: 0.089944942
      pregrasp_offset_m: 0.1
      # Width the can presents along THIS grasp's closing axis. Equal to the
      # diameter only because the closing axis is perpendicular to the can
      # axis; an axial grasp would need the 0.101 m height instead.
      required_gap_m: 0.066000000
      gap_clearance_m: 0.001944943
      approach_axis_object: [1.000000000, 0.000000000, 0.000000000]
      closing_axis_object: [0.000000000, 1.000000000, 0.000000000]
      pregrasp_position_object: [-0.100000000, 0.000000000, 0.011000000]

